<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Formatter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #222;
    }

    /* Top Bar - Sky Blue with Glow */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #87CEEB;
      color: #003366;
      padding: 1rem 2rem;
      border-bottom: 3px solid #5ca6d1;
      box-shadow: 0 0 12px #5ca6d1;
    }

    .topbar .title {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .topbar .logo img {
      height: 40px;
      width: auto;
      border-radius: 4px;
    }

    /* Main Card with Glow */
    .card {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      border: 3px solid #87CEEB;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 15px #87CEEB;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    .muted {
      color: #666;
      font-size: .95rem;
      margin-bottom: 2rem;
    }

    .box-row {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    /* Glowy Boxes */
    .box {
      flex: 1 1 300px;
      border: 3px solid #999;
      border-radius: 8px;
      padding: 1rem;
      background: #fafafa;
      box-shadow: 0 0 12px #999;
    }

    .box h3 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 1rem;
    }

    /* Glowy File Input */
    input[type="file"] {
      padding: .5rem;
      border: 3px dashed #bbb;
      border-radius: 6px;
      background: #fff;
      width: 100%;
      box-shadow: 0 0 10px #bbb;
    }

    .template {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .75rem;
    }

    /* Centered Glowy Buttons */
    .button-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      background: #ccc;
      color: #333;
      border: 3px solid #999;
      padding: .7rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 0 12px #999;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover:enabled {
      background: #bbb;
      box-shadow: 0 0 16px #666;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 600px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .topbar .logo {
        margin-top: 0.5rem;
      }

      .box-row {
        flex-direction: column;
      }

      .button-row {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="title">Resume Formatter</div>
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
    </div>
  </div>

  <!-- Main Card -->
  <div class="card">
    <h1></h1>
    <p class="muted">Upload a resume, pick a template, and download a formatted DOCX.</p>

    <form id="formatterForm" enctype="multipart/form-data">
      <div class="box-row">
        <!-- Upload Box -->
        <div class="box">
          <h3>Upload Resume</h3>
          <input type="file" name="resume" accept=".pdf,.docx" required />
        </div>

        <!-- Template Selection Box -->
        <div class="box">
          <h3>Select Template</h3>
          <div class="template">
            <input id="tpl-modern" type="radio" name="template" value="modern" checked />
            <label for="tpl-modern">Modern</label>
          </div>
          <div class="template">
            <input id="tpl-classic" type="radio" name="template" value="classic" />
            <label for="tpl-classic">Classic</label>
          </div>
          <div class="template">
            <input id="tpl-tabular" type="radio" name="template" value="tabular" />
            <label for="tpl-tabular">Tabular</label>
          </div>
          <div class="template">
            <input id="tpl-sidebar" type="radio" name="template" value="sidebar" />
            <label for="tpl-sidebar">Sidebar</label>
          </div>
          <div class="template">
            <input id="tpl-minimal" type="radio" name="template" value="minimal" />
            <label for="tpl-minimal">Minimal</label>
          </div>
        </div>
      </div>

      <div class="button-row">
        <button type="submit" id="convertBtn">Convert</button>
        <button type="button" id="downloadBtn" disabled>Download File</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('formatterForm');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    let fileId = null;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      convertBtn.disabled = true;

      try {
        const response = await fetch('/convert', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.status === 'success') {
          fileId = result.file_id;
          downloadBtn.disabled = false;
          alert('Resume converted successfully!');
        } else {
          alert('Conversion failed.');
        }
      } catch (err) {
        alert('Error during conversion.');
      } finally {
        convertBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', function () {
      if (fileId) {
        window.location.href = `/download/${fileId}`;
      }
    });
  </script>

</body>
</html>
